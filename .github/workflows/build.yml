# THE SUITE AGAINST THE SOURCE TREE, C ACCELERATOR BUILT IN PLACE.
# REQUIREMENTS COME FROM tests/install_locked.py (PER-PYTHON LOCK), NOT A pypi
# RESOLVE: THE MANAGED PACKAGES PIN EACH OTHER WITH ==

name: build

on:
  push:
    branches: [ "master", "dev" ]
    tags:
      - '[0-9]+'

jobs:
  test:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install test requirements
      run: |
        python -m pip install --upgrade pip setuptools
        python tests/install_locked.py

    - name: Build C accelerator
      run: python packaging/setup_speedups.py build_ext --inplace

    - name: Run tests
      env:
        CI: true
      run: python -m unittest discover -s tests -t . -v

    - name: Run tests, pure python
      env:
        CI: true
        MO_DOTS_PURE: 1
      run: python -m unittest discover -s tests -t .

  coverage:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install test requirements
      run: |
        python -m pip install --upgrade pip setuptools coverage coveralls
        python tests/install_locked.py

    - name: Build C accelerator
      run: python packaging/setup_speedups.py build_ext --inplace

    - name: Coverage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        coverage run --rcfile=packaging/coverage.ini -m unittest discover -s tests -t .
        coverage report --rcfile=packaging/coverage.ini
        coveralls
