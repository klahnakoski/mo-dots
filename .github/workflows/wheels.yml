# BUILD MACOS BINARY WHEELS (C ACCELERATOR); macos-13 = x86_64, macos-14 = arm64.
# WINDOWS AND LINUX WHEELS BUILD LOCALLY (packaging/build_wheels.py), WHICH ALSO
# DISPATCHES THIS WORKFLOW (--github) AND COLLECTS THE ARTIFACTS INTO dist/.

name: wheels

on:
  workflow_dispatch:

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14] # x86_64, arm64

    steps:
      - uses: actions/checkout@v4

      - name: Prepare setup.py with C extension
        shell: bash
        run: |
          cp packaging/setup.py setup.py
          python packaging/add_speedups.py setup.py --required

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_SKIP: "pp*"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND: >
            python -c "import mo_dots; assert type(mo_dots.to_data).__name__ == 'builtin_function_or_method'; d = mo_dots.to_data({'a': {'b': 1}}); assert d.a.b == 1; assert d.x.y == None"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
